name: Crew and event verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --include=dev
        working-directory: backend
      - run: npm ci --include=dev
        working-directory: frontend
      - name: Install isolated verification tools
        run: npm install --prefix "$RUNNER_TEMP/jawara-qa-tools" --no-package-lock --no-save @electric-sql/pglite@0.5.8 playwright@1.62.1
      - name: Backend and migration tests
        run: |
          export PGLITE_MODULE="$RUNNER_TEMP/jawara-qa-tools/node_modules/@electric-sql/pglite"
          node --test --test-concurrency=1 backend/tests/*.test.cjs backend/tests/security/*.test.cjs
      - name: Frontend regression tests
        working-directory: frontend
        run: node --experimental-vm-modules --test tests/*.test.mjs tests/crew-csv.test.cjs tests/employment-alignment.test.cjs tests/report-exports.test.cjs tests/location-budget.test.cjs
      - name: Type check and build
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run build
      - name: Install browser
        run: node "$RUNNER_TEMP/jawara-qa-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify crew and admin screens
        working-directory: frontend
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/jawara-qa-tools/node_modules/playwright"
          export QA_OUTPUT_DIR="$RUNNER_TEMP/jawara-qa/event"
          node tests/update-browser.cjs
      - name: Verify attendance success dialog
        working-directory: frontend
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/jawara-qa-tools/node_modules/playwright"
          export QA_OUTPUT_DIR="$RUNNER_TEMP/jawara-qa/attendance"
          node tests/guest-submission-browser.cjs
      - name: Verify dashboard, maps and language
        working-directory: frontend
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/jawara-qa-tools/node_modules/playwright"
          export QA_OUTPUT_DIR="$RUNNER_TEMP/jawara-qa/dashboard"
          node tests/dashboard-finance-browser.cjs
          export QA_OUTPUT_DIR="$RUNNER_TEMP/jawara-qa/location"
          node tests/location-language-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jawara-screen-and-export-checks
          path: ${{ runner.temp }}/jawara-qa
          if-no-files-found: ignore
